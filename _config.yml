# إعدادات Jekyll الرئيسية | Jekyll Main Configuration
# =====================================================

title: "selghribi | مطور ويب مغربي"
description: "مدونة تقنية عربية + بورتفوليو احترافي + قوالب ومشاريع مفتوحة المصدر"
url: "https://artsmoroccan.me"
baseurl: ""

# معلومات المالك | Author Information
author:
  name: "selghribi"
  email: ""
  bio: "طالب ومطور ويب مغربي | أبني مشاريع مفتوحة المصدر وأشارك رحلتي التقنية"
  avatar: "/assets/images/avatar.png"
  social:
    github: "selghribi-blip"
    twitter: ""
    linkedin: ""

# الإضافات | Plugins
theme: null
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# إعدادات Markdown | Markdown Settings
markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/

# الإعدادات الافتراضية | Default Settings
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true
  - scope:
      path: "pages"
    values:
      layout: "page"

# المجموعات | Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# البحث | Algolia Site Search
# search_key مفتاح بحث فقط (عام) — لا تضع هنا مفتاح Admin API
# search_key is a public search-only key — never put an Admin API key here.
# عند تغيير version حدّث قيم integrity في _layouts/default.html
# When bumping version, update the integrity hashes in _layouts/default.html.
algolia:
  app_id: "UOKFCFE2P9"
  search_key: "72e26b1e40a835929f864eb463bf5fe8"
  index_name: "artsmoroccan_me_uokfcfe2p9_pages"
  site_verification: "66F320FFCC865600"
  version: "1.0.15"

# إعدادات Sass | Sass Settings
sass:
  sass_dir: _sass
  style: compressed

# ملفات مستثناة | Excluded Files
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - scripts/
  - "*.py"
  - README.md

# إعدادات الخلاصة | Feed Settings
feed:
  posts_limit: 20

# اللغة الافتراضية | Default Language
lang: ar
